<!DOCTYPE html>
<html lang="en">
<head>

    <title>Download BTQ Sovereign Wallet</title>
    <style>
        body { background-color: #0d0d0d; color: #00ff88; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { border: 2px solid #00ff88; padding: 40px; border-radius: 10px; text-align: center; box-shadow: 0 0 20px #00ff88; }
        h1 { margin-bottom: 20px; }
        p { color: #888; }
        .btn { background-color: #00ff88; color: #000; padding: 15px 30px; text-decoration: none; font-weight: bold; border-radius: 5px; display: inline-block; margin-top: 30px; transition: 0.3s; }
        .btn:hover { background-color: #00cc77; transform: scale(1.05); }
        .ref-info { margin-top: 20px; font-size: 0.8em; color: #555; }

</head>
<body>

        <p id="ref-status">Detecting referral identity...</p>

        <div class="ref-info">
            SECURE | POST-QUANTUM | DECENTRALIZED
        </div>

    <script>
        // 1. Read 'ref' parameter from URL

        const referrer = urlParams.get('ref');

        if (referrer) {
            document.getElementById('ref-status').innerText = "Invited by: " + referrer;
            console.log("Referrer caught:", referrer);
        } else {
            document.getElementById('ref-status').innerText = "Direct Node Entry (No referral detected)";
        }

        function downloadWallet() {
            // 2. Logic to generate the config.json and package it with the binary
            // In a real implementation, the server would zip the binary with a custom config.json
            alert("This would download a pre-configured BTQ Wallet with referrer: " + (referrer || "None"));
            window.location.href = "https://github.com/BTQ-Chain/wallet/releases/latest";
        }
    </script>
</body>
</html>
