[package]
name = "sovereign-node"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
pbkdf2 = "0.12"
hmac = "0.12"
rpassword = "7"
libp2p = "0.53"
anyhow = "1"
btq-node = { path = "../btq-node" }

[[bin]]
name = "sovereign-node"
path = "src/main.rs"
